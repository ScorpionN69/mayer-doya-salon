  /* ---------- top bar ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 24px;
    z-index:20;

    display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.25);
    padding:6px 14px;
    border-radius:999px;
    font-size:.82rem;
    backdrop-filter: blur(4px);
  }
  .dot{width:7px; height:7px; border-radius:50%; background:#6fe08a; box-shadow:0 0 8px #6fe08a; animation: blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:.35}}

  /* ---------- scene ---------- */
  .scene{
    position:relative;
    width:100%;
    height:74vh;
    min-height:460px;
    overflow:hidden;
  }

  /* ---------- player ---------- */
  .player-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 10px 16px 40px;
    margin-top:20px;
  }

  .player{
    width:100%;
    max-width:640px;
    background: linear-gradient(120deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.06) 100%);
    border:1px solid rgba(255,255,255,.35);
    border-radius:22px;
    padding:10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    overflow:hidden;
    position:relative;
    z-index:10;
  }
  .player iframe{
    display:block;
    width:100%;
    border-radius:14px;
  }

  @media (max-width:640px){
    .scene{ height:50vh; min-height:320px; }
    .player{ padding:8px; border-radius:18px; }
  }

  <div class="topbar">
    <div class="clock" id="clock">--:--</div>
    <div class="radio-badge"><span class="dot"></span> সেলুনের রেডিও চলছে</div>
  </div>

  <div class="scene"></div>

  <div class="player-wrap">
    <div class="player">
      <iframe
        title="Spotify - এখন যা চলছে"
        src="https://open.spotify.com/embed/playlist/60C60SnyJePrV6l3GsFYUd?utm_source=generator&theme=0"
        width="100%"
        height="152"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>

<script>
  // ---------- clock ----------
  function updateClock(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h === 0) h = 12;
    document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
  }
  updateClock();
  setInterval(updateClock, 15000);

  
</script>
</body>
